<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masuk - OMNIGAMES</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <header class="header">
      <div class="logo">
        <h1>OMNIGAMES</h1>
      </div>
      <nav class="navbar">
        <a href="../index.html">Beranda</a>
        <a href="katalog.html">Katalog Game</a>
        <a href="marketplace.html">Marketplace</a>
        <a href="bantuan.html">Bantuan</a>
      </nav>
      <div class="user-menu">
        <a
          href="masuk.html"
          class="btn-login"
          style="background-color: #ffd700; color: #000000; font-weight: bold"
          >Masuk</a
        >
        <a href="daftar.html" class="btn-register">Daftar</a>
      </div>
    </header>

    <main class="container auth-container">
      <div class="auth-card">
        <h2>Masuk ke Akun</h2>

        <form action="javascript:void(0)">
          <div class="form-group">
            <label class="form-label">Email atau Username</label>
            <input
              type="text"
              class="form-control"
              placeholder="Masukkan email atau username"
              required
            />
          </div>

          <div class="form-group">
            <label class="form-label">Password</label>
            <input
              type="password"
              class="form-control"
              placeholder="Masukkan password"
              required
            />
          </div>

          <button type="submit" class="btn-auth">Masuk</button>
        </form>

        <div class="auth-links">
          <a href="javascript:alert('Fitur reset password akan segera hadir!')"
            >Lupa Password?</a
          >
          <p>Belum punya akun? <a href="daftar.html">Daftar sekarang</a></p>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="footer-content">
        <h3>OMNIGAMES</h3>
        <p>
          Platform marketplace dan portal informasi game digital terpercaya di
          Indonesia.
        </p>
      </div>
      <div class="footer-bottom">
        <p>&copy; 2026 OMNIGAMES Project. All rights reserved.</p>
      </div>
    </footer>
  </body>
</html>
